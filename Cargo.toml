[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/djynnius/pixelox"
homepage = "https://djynnius.github.io/pixelox"
authors = ["Sunday Ikpe <ikakke.ikpe@gmail.com>"]
rust-version = "1.85"

[workspace.dependencies]
pixelox-core = { path = "crates/pixelox-core", version = "0.3.0" }
pixelox-io = { path = "crates/pixelox-io", version = "0.3.0" }
pixelox-adjust = { path = "crates/pixelox-adjust", version = "0.3.0" }
pixelox-filter = { path = "crates/pixelox-filter", version = "0.3.0" }
pixelox-select = { path = "crates/pixelox-select", version = "0.3.0" }
pixelox-fx = { path = "crates/pixelox-fx", version = "0.3.0" }
pixelox-comp = { path = "crates/pixelox-comp", version = "0.3.0" }
pixelox-text = { path = "crates/pixelox-text", version = "0.3.0" }
pixelox-vector = { path = "crates/pixelox-vector", version = "0.3.0" }
pixelox-ml = { path = "crates/pixelox-ml", version = "0.3.0" }
pixelox-render = { path = "crates/pixelox-render", version = "0.3.0" }
pixelox-mcp = { path = "crates/pixelox-mcp", version = "0.3.0" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
rayon = "1.10"
glob = "0.3"
rand_core = "0.6"
rand_chacha = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
resvg = "0.45"
usvg = "0.45"
kurbo = "0.11"
tiny-skia = "0.11"
rustybuzz = "0.20"
ttf-parser = "0.25"
fontdb = "0.23"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
clap = { version = "4.5", features = ["string", "wrap_help"] }
clap_complete = "4.5"
tiny_http = "0.12"
# ML runtime (the `ml` feature): ONNX Runtime and verified model downloads, as in ferraus
ort = { version = "=2.0.0-rc.14" }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
