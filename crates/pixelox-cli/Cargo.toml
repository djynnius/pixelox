[package]
name = "pixelox"
default-run = "pixelox"
description = "A command-line raster and vector graphics workstation for scripts and AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["image", "photo", "cli", "graphics", "mcp"]
categories = ["multimedia::images", "command-line-utilities"]

[[bin]]
name = "pixelox"
path = "src/main.rs"

[lib]
name = "pixelox_cli"
path = "src/lib.rs"

[dependencies]
pixelox-core.workspace = true
pixelox-io.workspace = true
pixelox-adjust.workspace = true
pixelox-filter.workspace = true
pixelox-select.workspace = true
pixelox-fx.workspace = true
pixelox-comp.workspace = true
pixelox-text.workspace = true
pixelox-vector.workspace = true
pixelox-ml.workspace = true
pixelox-render.workspace = true
pixelox-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
glob.workspace = true
rayon.workspace = true
clap.workspace = true
clap_complete.workspace = true
