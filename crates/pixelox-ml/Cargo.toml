[package]
name = "pixelox-ml"
description = "AI-assisted ops (detect *, mask refine, fill content-aware) and the model registry (models *): ONNX Runtime inference with the ml feature, gated without it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = []
# ONNX Runtime inference and verified model downloads. Effective only on targets with a
# prebuilt ONNX Runtime (build.rs sets `cfg(pixelox_ml)`); elsewhere the build stays gated.
ml = ["dep:ort", "dep:ureq", "dep:sha2", "dep:hex"]

[dependencies]
pixelox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

# ort ships prebuilt ONNX Runtime libraries for these targets only (not musl, not Intel macOS)
[target.'cfg(not(any(target_env = "musl", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
ort = { workspace = true, optional = true }
